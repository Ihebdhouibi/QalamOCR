[project]
name = "qalamocr"
version = "0.1.0"
description = "Self-hostable, Arabic-first OCR & document-extraction engine"
readme = "README.md"
authors = [
    { name = "Iheb DHOUIBI", email = "ihebdhouibidh@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
]

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
